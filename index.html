<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Online devalue to JSON converter</title>
    <meta
      name="description"
      content="Convert devalue values as seen in Astro Actions to JSON online."
    />
    <script
      defer
      src="https://umami.tiborudvari.com/script.js"
      data-website-id="9afd6b7e-4274-4d61-9b05-ac1586f8e1c6"
    ></script>
  </head>
  <body>
    <main
      class="mx-auto max-w-screen-xl pt-5 flex flex-col gap-4 md:gap-4 px-2"
    >
      <div>
        <h1 class="text-3xl bold">Online devalue to JSON converter</h1>
        <p>
          Convert
          <a href="https://www.npmjs.com/package/devalue" class="underline"
            >devalue</a
          >
          strings as seen in Astro Actions to JSON for API debugging.
        </p>
      </div>
      <div class="flex flex-col md:flex-row w-full gap-2 md:gap-4">
        <div class="w-full">
          <textarea
            id="input"
            class="w-full min-h-[300px] md:min-h-[400px] p-4 bg-slate-900 text-slate-50 font-mono text-sm rounded-lg border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
            spellcheck="false"
            placeholder="Devalue string here ..."
          ></textarea>
        </div>
        <div class="w-full">
          <textarea
            id="output"
            class="w-full min-h-[300px] md:min-h-[400px] p-4 bg-slate-900 text-slate-50 font-mono text-sm rounded-lg border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
            spellcheck="false"
            placeholder="Result"
            readonly
          ></textarea>
        </div>
      </div>
      <footer class="text-right text-slate-500 text-sm">
        <span
          >Made by
          <a href="https://www.tiborudvari.com" class="underline"
            >Tibor Udvari</a
          ></span
        >
      </footer>
    </main>
    <script type="module">
      import { parse } from "https://unpkg.com/devalue?module";

      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");

      inputEl.addEventListener("input", () => {
        try {
          const value = inputEl.value.trim();
          if (!value) {
            outputEl.value = "";
            return;
          }
          const parsed = parse(value);
          outputEl.value = JSON.stringify(parsed, null, 2);
        } catch (err) {
          outputEl.value = `Error: ${err.message}`;
        }
      });

      const example = `[{"firstname":1,"lastname":2,"email":3},"Dizzy","McSnort","dizzy.mcsnort@clownfoolery.org"]`;
      inputEl.value = example;

      const event = new Event("input", {
        bubbles: true,
        cancelable: true,
      });
      inputEl.dispatchEvent(event);
    </script>
  </body>
</html>
